name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser e2e (mocked wallet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Start dev server
        run: npm run dev &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 60000
      - name: Run e2e (no GEN spent)
        run: npm run e2e

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for private keys, mnemonics, and secrets
        run: |
          set -e
          # 64-hex values that are NOT known transaction hashes / commit refs are suspicious.
          PATTERN='private[_-]?key|mnemonic|seed[_-]?phrase|BEGIN [A-Z ]*PRIVATE KEY|xprv[0-9a-zA-Z]{20,}'
          if grep -rInE "$PATTERN" \
                --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
                --include='*.json' --include='*.py' --include='*.yml' --include='*.yaml' \
                --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . ; then
            echo "::error::Potential secret found"; exit 1
          fi
          echo "No secrets detected."
