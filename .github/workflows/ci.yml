name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Build reproducibility (pinned SDK, one install, shared classes, source parity)
        run: npm run repro

      # `npm ls` exits non-zero on an unmet, invalid, or extraneous dependency,
      # and prints the resolved tree for the log. The stronger assertions —
      # exactly one lockfile entry, no nested duplicate install, and the
      # installed version matching the pin — are made by `npm run repro` above,
      # which can express them without fighting shell quoting.
      - name: Dependency tree — resolved genlayer-js
        run: npm ls genlayer-js

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser e2e (mocked wallet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Start dev server
        run: npm run dev &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 60000
      - name: Run e2e (no GEN spent)
        run: npm run e2e

      - name: Deploy calldata encoding (no GEN spent)
        run: npm run e2e:encoding

      - name: Accessibility scan (axe-core, WCAG 2.1 AA)
        run: npm run a11y

      - name: Visual sweep — console errors, failed requests, overflow, target size
        run: npm run shots

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for key material and recovery phrases
        run: |
          set -e
          # 64-hex values that are NOT known transaction hashes / commit refs are suspicious.
          #
          # Each alternative is written so it cannot match this file. Spelling
          # the recovery-phrase term out in full made the scanner match its own
          # definition, so the job failed on every commit and a real secret
          # would have been indistinguishable from that self-match. The bracket
          # keeps the regex meaning identical while breaking the literal.
          PATTERN='private[_-]?key|mnemon[i]c|seed[_-]?phrase|BEGIN [A-Z ]*PRIVATE KEY|xprv[0-9a-zA-Z]{20,}'
          if grep -rInE "$PATTERN" \
                --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
                --include='*.json' --include='*.py' --include='*.yml' --include='*.yaml' \
                --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . ; then
            echo "::error::Potential secret found"; exit 1
          fi
          echo "No secrets detected."
